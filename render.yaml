# Despliegue en Render (plan gratuito). En Render: New → Blueprint → elige este repositorio.
# Te pedirá los valores marcados con `sync: false`; SESSION_SECRET se genera solo.
services:
  - type: web
    name: archivo-riftbound
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_NAME
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
