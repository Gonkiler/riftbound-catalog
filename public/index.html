<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>%TITLE%</title>
  <meta name="description" content="%DESCRIPTION%">
  <!-- Vista previa al pegar el enlace en WhatsApp, Discord, Telegram… (el servidor o el build rellenan título y descripción) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="%TITLE%">
  <meta property="og:description" content="%DESCRIPTION%">
  <meta property="og:image" content="https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/15ed971e4029a92b362a81ccadf309fb81e40b81-744x1039.png?w=600&amp;auto=format">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#12151f">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cmsassets.rgpub.io">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <!-- Escritorio: barra lateral fija. En el móvil se oculta y las colecciones se abren en una hoja. -->
  <aside class="rail" aria-label="Colecciones">
    <div class="brand">
      <svg class="logo" width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="5" width="14" height="22" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 10l4 6-4 6-4-6z" fill="currentColor"/></svg>
      <span>Archivo Riftbound<small class="brandSub">Catálogo de cartas</small></span>
    </div>
    <nav class="setnav" id="railSets"></nav>
    <div class="railfoot" id="railFoot">Cargando cartas…</div>
  </aside>

  <main class="main">
    <header class="head" id="head">
      <div class="hrow">
        <button type="button" class="setpick" id="setPick" aria-haspopup="dialog" aria-label="Elegir colección">
          <span class="mbrand brandSub">Archivo Riftbound</span>
          <h1 id="setTitle">Cargando…</h1>
          <svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="hacts">
          <button type="button" class="iconbtn only-m" id="searchToggle" aria-label="Buscar" aria-pressed="false">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="act only-d primary" id="scanBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="8.5" y="7" width="7" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Escanear
          </button>
          <button type="button" class="act iconish" id="shareBtn" title="Enlace a esta vista, con los filtros puestos" aria-label="Compartir enlace">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14l4-4M10.5 6.5l1.5-1.5a4 4 0 015.7 5.7L16.2 12M13.5 17.5L12 19a4 4 0 01-5.7-5.7L7.8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="only-d">Compartir</span>
          </button>
          <button type="button" class="act only-d" id="copyBtn" title="Copia las cartas que se ven ahora como texto, para pegarlas en un chat">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 15V5.5C4 4.7 4.7 4 5.5 4H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Copiar lista
          </button>
          <button type="button" class="adminbtn only-d" id="adminBtn" hidden aria-pressed="false">Editar</button>
        </div>
      </div>
      <div class="statline" id="stats" aria-live="polite"></div>
      <div class="frow">
        <input class="search" id="q" type="search" placeholder="Buscar por nombre o número" aria-label="Buscar carta" autocomplete="off" enterkeyhint="search">
        <div class="filters" id="filters">
          <div class="seg" role="group" aria-label="Mostrar">
            <button type="button" data-own="all" aria-pressed="true">Todas</button>
            <button type="button" data-own="have" aria-pressed="false">Las tengo</button>
            <button type="button" data-own="miss" aria-pressed="false">Me faltan</button>
            <button type="button" data-own="dup" aria-pressed="false" title="Cartas de las que hay más de una copia">Repetidas</button>
          </div>
          <div class="chips" id="rarChips" role="group" aria-label="Rareza"></div>
        </div>
      </div>
      <div class="notice" id="notice" hidden></div>
    </header>

    <section class="grid" id="grid" aria-live="polite"></section>
    <div class="sentinel" id="sentinel" aria-hidden="true"></div>
  </main>
</div>

<!-- Móvil: navegación abajo, al alcance del pulgar -->
<nav class="bnav" aria-label="Acciones">
  <button type="button" id="bSets"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>Colecciones</button>
  <button type="button" id="bScan" class="bscan"><span><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="8.5" y="7" width="7" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>Escanear</button>
  <button type="button" id="bCopy"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 15V5.5C4 4.7 4.7 4 5.5 4H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Copiar lista</button>
  <button type="button" id="bEdit" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="bEditLabel">Editar</span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
